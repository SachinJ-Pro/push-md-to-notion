# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Push Markdown to Notion
description: Push markdown changes to Notion
author: Josh Stern <josh.stern95@gmail.com>
branding:
  color: blue
  icon: book-open
inputs:
  notion-token:
    description: 'Notion integration token'
    required: true
  notion-parent-page-id:
    description: 'Parent Notion page ID used for creating new pages when notion_page frontmatter is not present'
    required: true
  target-env:
    description: 'Sync target environment: preview or prod'
    required: false
  deletion-mode:
    description: 'Deletion mode for removed markdown files: hard-delete or keep'
    required: false
  write-back-frontmatter:
    description: 'Write notion page IDs back to markdown frontmatter and push bot commit (true/false)'
    required: false
  base-revision:
    description: 'Optional git base revision for change detection (e.g. PR base SHA)'
    required: false
runs:
  using: 'node20'
  main: 'dist/main.js'
